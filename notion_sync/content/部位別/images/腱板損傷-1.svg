<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460" font-family="'Hiragino Sans','Yu Gothic',sans-serif">
  <defs>
    <radialGradient id="humG" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fbe4a8"/>
      <stop offset="100%" stop-color="#d99c2e"/>
    </radialGradient>
    <linearGradient id="supra" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bfe3d8"/>
      <stop offset="100%" stop-color="#4a9c89"/>
    </linearGradient>
    <linearGradient id="infra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0d3ef"/>
      <stop offset="100%" stop-color="#8a68b8"/>
    </linearGradient>
  </defs>
  <rect width="480" height="460" fill="#ffffff"/>
  <text x="240" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#2b2a27">腱板筋群(肩関節を背面から見た模式図)</text>

  <!-- scapula -->
  <path d="M100,140 C90,200 95,270 120,330 C140,365 175,385 210,388
           L230,340 C195,332 165,312 150,280 C135,245 133,195 145,150 Z"
        fill="#f6e3c8" stroke="#d8c3a5" stroke-width="2"/>
  <text x="115" y="355" text-anchor="middle" font-size="13" fill="#8a7444">肩甲骨</text>

  <!-- humeral head (ball) -->
  <circle cx="290" cy="230" r="70" fill="url(#humG)" stroke="#b8860b" stroke-width="2"/>
  <text x="290" y="235" text-anchor="middle" font-size="13" fill="#7a5c1a" font-weight="600">上腕骨頭</text>

  <!-- supraspinatus: over the top -->
  <path d="M180,150 C220,120 270,112 310,130
           C325,137 328,150 320,160
           C285,148 240,152 205,175
           C192,168 182,160 180,150 Z"
        fill="url(#supra)" stroke="#2f7f6f" stroke-width="2"/>
  <text x="220" y="120" font-size="13" fill="#2f7f6f" font-weight="600">棘上筋</text>

  <!-- infraspinatus + teres minor: covering the back -->
  <path d="M150,190 C185,175 235,178 268,200
           C290,215 300,240 296,265
           C290,290 265,300 235,292
           C195,282 160,255 148,220
           C144,208 146,198 150,190 Z"
        fill="url(#infra)" stroke="#7a5ca8" stroke-width="2"/>
  <text x="175" y="240" font-size="13" fill="#6a4a92" font-weight="600">棘下筋</text>
  <text x="170" y="258" font-size="12" fill="#8a8578">(+小円筋)</text>

  <text x="20" y="420" font-size="13" fill="#8a8578">※外旋筋群(棘下筋・小円筋)は減速のブレーキ役を担い、負担が集中しやすい</text>
</svg>
