<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" font-family="'Hiragino Sans','Yu Gothic',sans-serif">
  <defs>
    <radialGradient id="skin4" cx="42%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#fbead9"/>
      <stop offset="100%" stop-color="#eccbac"/>
    </radialGradient>
    <linearGradient id="itband" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fc2b0"/>
      <stop offset="100%" stop-color="#3d8a78"/>
    </linearGradient>
  </defs>
  <rect width="480" height="560" fill="#ffffff"/>
  <text x="240" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#2b2a27">腸脛靭帯(脚を外側から見た模式図)</text>
  <text x="240" y="66" text-anchor="middle" font-size="13" fill="#8a8578">股関節側</text>

  <!-- leg silhouette: hip/thigh to below knee -->
  <path d="M155,80 C120,148 114,235 132,308
           C120,338 110,388 114,438
           C118,472 132,497 157,510
           L292,510
           C314,493 324,463 320,432
           C316,392 302,342 277,308
           C300,235 294,148 260,80
           C222,64 190,64 155,80 Z"
        fill="url(#skin4)" stroke="#d8c3a5" stroke-width="3"/>
  <line x1="114" y1="313" x2="320" y2="313" stroke="#c9c4b4" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="336" y="318" font-size="13" fill="#8a8578">膝関節</text>

  <!-- lateral femoral condyle bump -->
  <path d="M247,268 C267,283 277,298 280,313
           C282,328 276,340 264,344
           C252,340 246,328 246,313
           C246,296 246,280 247,268 Z"
        fill="#f6e3c8" stroke="#d8c3a5" stroke-width="1.5"/>
  <text x="332" y="343" font-size="12" fill="#8a8578">大腿骨外顆</text>

  <!-- IT band: hip/TFL & gluteus max down to Gerdy's tubercle -->
  <path d="M177,97 C167,150 170,220 182,280
           C192,320 207,350 220,380
           C234,405 246,420 254,435"
        fill="none" stroke="url(#itband)" stroke-width="11" stroke-linecap="round"/>

  <!-- friction point highlight -->
  <circle cx="260" cy="323" r="16" fill="#f3c3bf" fill-opacity="0.8" stroke="#b3413e" stroke-width="2"/>

  <text x="70" y="102" font-size="14" fill="#2f7f6f" font-weight="600">大腿筋膜張筋・</text>
  <text x="70" y="120" font-size="14" fill="#2f7f6f" font-weight="600">大殿筋(起始)</text>

  <text x="200" y="470" text-anchor="middle" font-size="14" fill="#2f7f6f" font-weight="600">脛骨(Gerdy結節)へ付着</text>

  <text x="20" y="535" font-size="13" fill="#8a8578">※赤丸は膝軽度屈曲位(約20〜30度)で摩擦が最大になる位置</text>
</svg>
