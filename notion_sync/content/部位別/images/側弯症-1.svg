<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" font-family="'Hiragino Sans','Yu Gothic',sans-serif">
  <rect width="480" height="400" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#2b2a27">脊椎を背中から見た模式図(正常 / 側弯)</text>

  <!-- panel 1: normal -->
  <g>
    <text x="80" y="58" text-anchor="middle" font-size="14" fill="#8a8578">正常</text>
    <line x1="40" y1="70" x2="120" y2="70" stroke="#c9c4b4" stroke-width="2"/>
    <line x1="40" y1="330" x2="120" y2="330" stroke="#c9c4b4" stroke-width="2"/>
    <path d="M80,70 L80,330" stroke="#2f7f6f" stroke-width="6" stroke-linecap="round" fill="none"/>
    <g fill="#2f7f6f">
      <circle cx="80" cy="90" r="5"/><circle cx="80" cy="120" r="5"/><circle cx="80" cy="150" r="5"/>
      <circle cx="80" cy="180" r="5"/><circle cx="80" cy="210" r="5"/><circle cx="80" cy="240" r="5"/>
      <circle cx="80" cy="270" r="5"/><circle cx="80" cy="300" r="5"/>
    </g>
  </g>

  <!-- panel 2: functional / C-curve -->
  <g>
    <text x="240" y="58" text-anchor="middle" font-size="14" fill="#8a8578">機能性側弯(C字カーブ)</text>
    <line x1="200" y1="70" x2="280" y2="70" stroke="#c9c4b4" stroke-width="2"/>
    <line x1="195" y1="330" x2="275" y2="330" stroke="#c9c4b4" stroke-width="2" transform="rotate(-4 235 330)"/>
    <path d="M240,70 C210,140 210,200 240,260 C255,290 250,310 240,330" stroke="#b8860b" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- panel 3: structural / S-curve -->
  <g>
    <text x="400" y="58" text-anchor="middle" font-size="14" fill="#8a8578">構築性側弯(S字カーブ)</text>
    <line x1="360" y1="70" x2="440" y2="70" stroke="#c9c4b4" stroke-width="2" transform="rotate(3 400 70)"/>
    <line x1="360" y1="330" x2="440" y2="330" stroke="#c9c4b4" stroke-width="2" transform="rotate(-5 400 330)"/>
    <path d="M410,70 C380,110 430,170 400,210 C375,245 415,290 390,330" stroke="#b3413e" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <text x="20" y="365" font-size="13" fill="#8a8578">横線は肩・骨盤の高さの目安。傾きの左右差が側弯の見た目に表れる</text>
</svg>
