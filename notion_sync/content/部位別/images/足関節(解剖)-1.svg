<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 350" font-family="'Hiragino Sans','Yu Gothic',sans-serif">
  <defs>
    <linearGradient id="bone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6ecd8"/>
      <stop offset="100%" stop-color="#e2cfa6"/>
    </linearGradient>
  </defs>
  <rect width="480" height="350" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#2b2a27">足関節の外側靭帯(外側から見た模式図)</text>

  <!-- fibula -->
  <path d="M200,50 C196,90 196,140 202,180 C222,186 238,186 250,180 C254,140 254,90 250,50 C234,42 214,42 200,50 Z"
        fill="url(#bone)" stroke="#c9b078" stroke-width="2"/>
  <text x="225" y="115" text-anchor="middle" font-size="13" fill="#8a7444">腓骨</text>

  <!-- talus -->
  <path d="M188,190 C188,205 195,225 215,232 C240,238 262,230 272,212 C276,200 272,188 260,182 C240,176 208,178 188,190 Z"
        fill="url(#bone)" stroke="#c9b078" stroke-width="2"/>
  <text x="230" y="212" text-anchor="middle" font-size="13" fill="#8a7444">距骨</text>

  <!-- calcaneus -->
  <path d="M190,250 C180,270 175,300 195,320 L320,320
           C335,310 335,290 320,275 L260,260 Z"
        fill="url(#bone)" stroke="#c9b078" stroke-width="2"/>
  <text x="270" y="295" text-anchor="middle" font-size="13" fill="#8a7444">踵骨</text>

  <!-- ATFL: anterior talofibular -->
  <path d="M225,190 C245,205 265,215 285,222" stroke="#4a9c89" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- CFL: calcaneofibular -->
  <path d="M215,195 C205,225 200,255 200,280" stroke="#d99c2e" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- PTFL: posterior talofibular -->
  <path d="M210,175 C195,195 185,210 178,225" stroke="#8a68b8" stroke-width="7" stroke-linecap="round" fill="none"/>

  <text x="330" y="220" font-size="14" fill="#2f7f6f" font-weight="600">前距腓靭帯(ATFL)</text>
  <text x="330" y="270" font-size="14" fill="#b8860b" font-weight="600">踵腓靭帯(CFL)</text>
  <text x="70" y="180" font-size="14" fill="#7a5ca8" font-weight="600">後距腓靭帯(PTFL)</text>

  <text x="20" y="340" font-size="13" fill="#8a8578">※内反捻挫では前距腓靭帯が最も損傷しやすい</text>
</svg>
