<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" font-family="'Hiragino Sans','Yu Gothic',sans-serif">
  <defs>
    <radialGradient id="skinSprain" cx="42%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#fbead9"/>
      <stop offset="100%" stop-color="#eccbac"/>
    </radialGradient>
  </defs>
  <rect width="480" height="380" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#2b2a27">内反捻挫の受傷機転(足を後ろから見た模式図)</text>

  <!-- lower leg -->
  <path d="M195,60 C185,100 182,140 188,175 L285,190 C300,150 298,105 285,65 C255,50 220,50 195,60 Z"
        fill="url(#skinSprain)" stroke="#d8c3a5" stroke-width="3"/>

  <!-- foot rolled inward (inverted) -->
  <path d="M188,175 C160,185 130,205 120,235 C112,258 122,278 150,282
           L290,265 C300,240 298,210 285,190 Z"
        fill="url(#skinSprain)" stroke="#d8c3a5" stroke-width="3" transform="rotate(18 205 225)"/>

  <!-- stretched lateral ligaments (highlighted, taut) -->
  <path d="M170,195 C155,215 145,235 142,255" stroke="#c85f5a" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M180,180 C168,200 160,222 158,244" stroke="#c85f5a" stroke-width="6" stroke-linecap="round" fill="none"/>

  <text x="60" y="230" font-size="13" fill="#b3413e" font-weight="600">外側靭帯が</text>
  <text x="60" y="248" font-size="13" fill="#b3413e" font-weight="600">急激に伸長される</text>

  <!-- inward rotation arrow -->
  <path d="M300,220 C280,250 250,270 215,275" stroke="#8a68b8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M215,275 l14,-4 M215,275 l4,13" stroke="#8a68b8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="330" y="235" font-size="13" fill="#7a5ca8" font-weight="600">足部が内側に</text>
  <text x="330" y="253" font-size="13" fill="#7a5ca8" font-weight="600">巻き込まれる</text>

  <text x="20" y="330" font-size="13" fill="#8a8578">※前距腓靭帯・踵腓靭帯・後距腓靭帯の順に損傷しやすい</text>
</svg>
