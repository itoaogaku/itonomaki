<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 580" font-family="'Hiragino Sans','Yu Gothic',sans-serif">
  <defs>
    <radialGradient id="skin2" cx="42%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fbead9"/>
      <stop offset="100%" stop-color="#eccbac"/>
    </radialGradient>
    <linearGradient id="gastro" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#bfe3d8"/>
      <stop offset="55%" stop-color="#7fc2b0"/>
      <stop offset="100%" stop-color="#4a9c89"/>
    </linearGradient>
    <linearGradient id="soleus" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0d3ef"/>
      <stop offset="55%" stop-color="#b79ed6"/>
      <stop offset="100%" stop-color="#8a68b8"/>
    </linearGradient>
    <linearGradient id="achilles" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbe4a8"/>
      <stop offset="100%" stop-color="#d99c2e"/>
    </linearGradient>
  </defs>

  <rect width="480" height="580" fill="#ffffff"/>
  <text x="240" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#2b2a27">腓腹筋とヒラメ筋(下腿を横から見た模式図)</text>
  <text x="240" y="66" text-anchor="middle" font-size="13" fill="#8a8578">膝側</text>

  <!-- lower leg silhouette -->
  <path d="M175,80 C138,130 126,215 142,295
           C150,345 160,395 182,438
           C196,460 212,470 226,472
           L300,472
           C316,455 326,428 328,398
           C332,345 322,265 302,175
           C286,115 258,86 216,76
           C202,74 186,76 175,80 Z"
        fill="url(#skin2)" stroke="#d8c3a5" stroke-width="3"/>

  <!-- soleus (deep, peeking at sides/lower) -->
  <path d="M172,155 C148,205 140,275 152,335
           C160,378 172,415 190,446
           L218,446 C206,414 197,376 194,338
           C191,285 197,225 210,175
           C198,160 184,153 172,155 Z"
        fill="url(#soleus)" stroke="#7a5ca8" stroke-width="2" stroke-linejoin="round"/>
  <path d="M302,178 C316,222 322,278 317,328
           C312,368 302,408 288,444
           L262,444 C274,404 283,364 286,324
           C289,268 282,218 268,175
           C280,170 292,172 302,178 Z"
        fill="url(#soleus)" stroke="#7a5ca8" stroke-width="2" stroke-linejoin="round"/>

  <!-- gastrocnemius (superficial, two heads, visible bulge) -->
  <path d="M178,95 C150,140 140,200 150,255
           C158,297 178,322 208,326
           C236,322 252,296 258,254
           C264,202 254,144 226,98
           C210,86 190,86 178,95 Z"
        fill="url(#gastro)" stroke="#2f7f6f" stroke-width="2" stroke-linejoin="round"/>
  <path d="M195,105 C178,145 172,195 180,240" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round"/>

  <!-- achilles tendon -->
  <path d="M225,325 C233,368 233,410 228,444 L272,444
           C266,410 264,368 260,325 Z"
        fill="url(#achilles)" stroke="#b8860b" stroke-width="2"/>

  <text x="240" y="495" text-anchor="middle" font-size="13" fill="#8a8578">足首側(アキレス腱)</text>

  <g font-size="14">
    <rect x="20" y="510" width="16" height="16" fill="url(#gastro)" stroke="#2f7f6f"/>
    <text x="42" y="523" fill="#2b2a27">腓腹筋(浅層・膨らみが見える)</text>

    <rect x="20" y="533" width="16" height="16" fill="url(#soleus)" stroke="#7a5ca8"/>
    <text x="42" y="546" fill="#2b2a27">ヒラメ筋(深層・外からは見えにくい)</text>

    <rect x="300" y="510" width="16" height="16" fill="url(#achilles)" stroke="#b8860b"/>
    <text x="322" y="523" fill="#2b2a27">アキレス腱</text>
  </g>
</svg>
